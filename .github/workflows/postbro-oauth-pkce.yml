name: PostBro Generic OAuth PKCE

on:
  pull_request:
    paths:
      - 'apps/backend/src/services/auth/providers/oauth.pkce.ts'
      - 'apps/backend/src/services/auth/providers/oauth.provider.ts'
      - 'apps/backend/src/services/auth/providers.interface.ts'
      - 'apps/backend/src/services/auth/auth.service.ts'
      - 'apps/backend/src/api/routes/auth.controller.ts'
      - 'tests/postbro-oauth-pkce.test.mjs'
      - '.github/workflows/postbro-oauth-pkce.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/src/services/auth/providers/oauth.pkce.ts'
      - 'apps/backend/src/services/auth/providers/oauth.provider.ts'
      - 'apps/backend/src/services/auth/providers.interface.ts'
      - 'apps/backend/src/services/auth/auth.service.ts'
      - 'apps/backend/src/api/routes/auth.controller.ts'
      - 'tests/postbro-oauth-pkce.test.mjs'
      - '.github/workflows/postbro-oauth-pkce.yml'

permissions:
  contents: read

jobs:
  pkce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Test isolated PKCE helper (no credentials)
        run: node --experimental-strip-types --test tests/postbro-oauth-pkce.test.mjs
