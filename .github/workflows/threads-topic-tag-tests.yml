name: Threads Topic Tag Tests
on:
  push:
    branches: ['feat/threads-topic-tag']
    paths:
      - '.github/workflows/threads-topic-tag-tests.yml'
      - 'libraries/nestjs-libraries/src/dtos/posts/providers-settings/threads.dto.ts'
      - 'libraries/nestjs-libraries/src/integrations/social/threads.provider.ts'
      - 'libraries/nestjs-libraries/src/integrations/social/threads.topic-tag.spec.ts'
      - 'apps/frontend/src/components/new-launch/providers/threads/threads.provider.tsx'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Threads Topic Tag unit tests
        run: |
          cat > postiz-topic-jest.config.cjs <<'EOF'
          module.exports = {
            rootDir: '.',
            testEnvironment: 'node',
            testRegex: 'threads\\.topic-tag\\.spec\\.ts$',
            transform: {
              '^.+\\.[tj]sx?$': ['ts-jest', {
                tsconfig: 'tsconfig.base.json',
                isolatedModules: true,
                diagnostics: false,
              }],
            },
            moduleNameMapper: {
              '^@gitroom/nestjs-libraries/(.*)$': '<rootDir>/libraries/nestjs-libraries/src/$1',
              '^@gitroom/helpers/(.*)$': '<rootDir>/libraries/helpers/src/$1',
              '^@gitroom/react/(.*)$': '<rootDir>/libraries/react-shared-libraries/src/$1',
              '^@gitroom/backend/(.*)$': '<rootDir>/apps/backend/src/$1',
              '^@gitroom/frontend/(.*)$': '<rootDir>/apps/frontend/src/$1',
            },
          };
          EOF
          pnpm exec jest --config ./postiz-topic-jest.config.cjs --runInBand --coverage=false
